name: Build GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'GKI Kernel Branch'
        required: true
        default: 'android15-6.6'
        type: choice
        options:
          - android15-6.6
          - android14-6.1
      susfs_mode:
        description: "SUSFS Mode [built‑in / lkm]"
        required: true
        default: "lkm"
        type: choice
        options:
          - built‑in
          - lkm
      enable_bbg:
        description: "Enable BBG Patch"
        required: true
        default: true
        type: boolean
      enable_ddk:
        description: "Enable DDK Patch (Conflict with BBG)"
        required: true
        default: false
        type: boolean
      root_impl:
        description: "Root implementation"
        required: true
        default: "SukiSU‑Ultra"
        type: choice
        options:
          - KernelSU
          - SukiSU‑Ultra

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y repo git‑lfs python3‑kerberos

      - name: Repo init & sync kernel manifest
        run: |
          mkdir‑p ~/gki‑kernel
          cd ~/gki‑kernel
          # ========== 已移除失效清华源，使用github镜像manifest ==========
          repo init‑u https://github.com/AndroidKernelManifest/kernel‑manifest.git‑b ${{ github.event.inputs.kernel_branch }}‑g common
          repo sync‑j$(nproc)‑c‑q
        shell: bash

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Apply patches & defconfig & compile
        run: |
          # 此处保留你原有仓库的编译脚本逻辑
          echo "kernel_branch=${{ github.event.inputs.kernel_branch }}"
          echo "susfs_mode=${{ github.event.inputs.susfs_mode }}"
          echo "enable_bbg=${{ github.event.inputs.enable_bbg }}"
          echo "enable_ddk=${{ github.event.inputs.enable_ddk }}"
          echo "root_impl=${{ github.event.inputs.root_impl }}"
        shell: bash
