name: Build My GKI Kernel
on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: 启用SUSFS-NG(内核文件/属性隐藏)
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_bbg:
        description: 启用BBG(BL伪回锁、bootconfig/cmdline隐藏)
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 拉取 Google ACK 官方 GKI 内核 固定 v6.6.77
        run: |
          git clone --depth 1 --branch v6.6.77 https://android.googlesource.com/kernel/common kernel
          cd kernel
          git log -1 --oneline

      - name: 拉取 SukiSU-Ultra main 最新开发分支
        run: |
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU-Ultra suki

      - name: 拉取 SUSFS-NG / BBG / AnyKernel3 main
        run: |
          git clone --depth 1 https://github.com/SukiSU-Ultra/SUSFS-NG susfs
          git clone --depth 1 https://github.com/SukiSU-Ultra/BBG bbg
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: 应用 SukiSU-Ultra 内核补丁
        working-directory: ./kernel
        run: |
          ../suki/kernel/patch.sh

      - name: 应用 SUSFS-NG 完整 VFS 隐藏补丁
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        working-directory: ./kernel
        run: |
          ../susfs/patch.sh

      - name: 应用 BBG BL伪回锁 + bootconfig/cmdline 拦截补丁
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: ./kernel
        run: |
          ../bbg/patch.sh

      - name: 下载 Proton-Clang 编译器
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang clang-toolchain

      - name: 导入 defconfig (ARM64 K90)
        run: |
          cp ./defconfig kernel/arch/arm64/configs/my_defconfig
          cd kernel
          make O=out ARCH=arm64 my_defconfig

      - name: 编译内核 Image
        run: |
          cd kernel
          make O=out ARCH=arm64 -j$(nproc) CC=../clang-toolchain/bin/clang

      - name: 导出 final.config
        run: cp kernel/out/.config ./final.config

      - name: 打包 AnyKernel3 刷机包
        run: |
          cp kernel/out/arch/arm64/boot/Image ak3/
          cd ak3
          zip -r ../AnyKernel3-my-kernel.zip *

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            final.config
            AnyKernel3-my-kernel.zip
