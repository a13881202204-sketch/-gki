name: Build My GKI Kernel Repo‑Mode 6.6.77
on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: 启用SUSFS‑NG(内核文件伪装)
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_bbg:
        description: 启用BBG伪回锁补丁
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      - name: 安装依赖 + Repo，清华镜像浅同步内核
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git python3
          mkdir -p kernel
          cd kernel
          repo init -u https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/manifest.git -b android15-6.6-2025-03 --depth=1
          repo sync -c --no-tags -j4

      - name: 校验内核版本
        run: |
          cd kernel/common
          git log -1 --oneline
          make kernelversion

      - name: 拉取SukiSU‑Ultra SUSFS‑NG BBG AnyKernel3
        run: |
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU-Ultra suki
          git clone --depth 1 https://github.com/SukiSU-Ultra/SUSFS-NG susfs
          git clone --depth 1 https://github.com/SukiSU-Ultra/BBG bbg
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: 应用SukiSU‑Ultra内核补丁
        working-directory: ./kernel/common
        run: |
          ../../suki/kernel/patch.sh

      - name: 应用SUSFS‑NG补丁
        if: ${{ github.event.inputs.enable_susfs == 'true' }}
        working-directory: ./kernel/common
        run: |
          ../../susfs/patch.sh

      - name: 应用BBG伪回锁补丁
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: ./kernel/common
        run: |
          ../../bbg/patch.sh

      - name: 下载Proton‑Clang编译器
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang clang-toolchain

      - name: 导入defconfig，追加内核开关
        run: |
          cp ./defconfig kernel/common/arch/arm64/configs/my_defconfig
          cd kernel/common
          make O=out ARCH=arm64 my_defconfig
          ./scripts/config --file out/.config --enable KALLSYMS
          ./scripts/config --file out/.config --disable KSU_DEBUG
          make O=out ARCH=arm64 olddefconfig

      - name: 编译内核Image
        run: |
          cd kernel/common
          make O=out ARCH=arm64 -j4 CC=../../clang-toolchain/bin/clang

      - name: 导出最终.config
        run: cp kernel/common/out/.config ./final.config

      - name: 组装AK3刷机包
        run: |
          cp ./ak3-patch/anykernel.sh ak3/anykernel.sh
          cp kernel/common/out/arch/arm64/boot/Image ak3/
          cd ak3
          zip -r ../AnyKernel3-my-kernel.zip *

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            final.config
            AnyKernel3-my-kernel.zip
